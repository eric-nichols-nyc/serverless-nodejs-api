service: serverless-nodejs-api
useDotenv: true

provider:
  name: aws
  runtime: nodejs20.x
  environment:
    DEBUG: ${env:DEBUG, 0}
    STAGE: ${env:STAGE, "prod"}
  iam:
    role:
      statements:
        - Effect: Allow
          Resource: "*"
          Action:
            - ssm:GetParameter
            - ssm:GetParameters
            - ssm:GetParametersByPath
            - ssm:GetParameterHistory
            - ssm:DescribeParameters

functions:
  api:
    handler: src/index.handler
    events:
      - httpApi: '*'

custom:
  esbuild:
    bundle: true
    minify: true
    packager: pnpm
  dotenv:
    exclude:
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
      - DATABASE_URL

plugins:
  - serverless-esbuild
  - serverless-offline
  - serverless-dotenv-plugin
